[workspace]
members = [
    "crates/trk-ai",
    "crates/trk-audio",
    "crates/trk-app",
    "crates/trk-core",
    "crates/trk-interop",
    "crates/trk-midi",
    "crates/trk-sampler",
    "crates/trk-tui",
    "crates/trk-transform",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
description = "Terminal tracker and music composition environment"
homepage = "https://github.com/delaudio/trk"
repository = "https://github.com/delaudio/trk"

[workspace.dependencies]
anyhow = "1"
crossterm = "0.28"
ctrlc = "3"
flate2 = "1"
midir = { version = "0.10", features = ["coremidi_send_timestamped"] }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
