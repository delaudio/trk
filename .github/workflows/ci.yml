name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Rust file size budgets
        run: |
          scripts/test-rust-file-sizes.sh
          scripts/check-rust-file-sizes.sh

      - name: Check crate dependency boundaries
        run: |
          python3 scripts/test_check_crate_dependencies.py
          python3 scripts/check_crate_dependencies.py

      - name: Test
        run: cargo test --all-targets --all-features

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
