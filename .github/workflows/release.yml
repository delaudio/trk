name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate tag and package version
        run: bash scripts/release-guard.sh
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked

  build-macos:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            architecture: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build immutable release archive
        env:
          TARGET: ${{ matrix.target }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          bash scripts/release-guard.sh
          version="${GITHUB_REF_NAME#v}"
          archive="trk-${version}-macos-${ARCHITECTURE}.tar.gz"
          stage="dist/stage-${ARCHITECTURE}"
          mkdir -p "$stage" dist/release
          cargo build --locked --release --target "$TARGET" -p trk-app
          cp "target/$TARGET/release/trk" "$stage/trk"
          tar -czf "dist/release/$archive" -C "$stage" trk
          checksum="$(shasum -a 256 "dist/release/$archive" | awk '{print $1}')"
          printf '%s  %s\n' "$checksum" "$archive" > "dist/release/$archive.sha256"
          cat > "dist/release/trk-${ARCHITECTURE}-metadata.json" <<EOF
          {
            "version": "$version",
            "architecture": "$ARCHITECTURE",
            "target": "$TARGET",
            "commit": "$GITHUB_SHA",
            "workflow_run": "$GITHUB_RUN_ID"
          }
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: trk-macos-${{ matrix.architecture }}
          path: dist/release/*
          if-no-files-found: error

  build-linux:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install ALSA dev dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Build immutable Linux release archive
        run: |
          bash scripts/release-guard.sh
          version="${GITHUB_REF_NAME#v}"
          archive="trk-${version}-linux-x86_64.tar.gz"
          mkdir -p dist/stage-linux-x86_64 dist/release
          cargo build --locked --release -p trk-app
          cp target/release/trk dist/stage-linux-x86_64/trk
          tar -czf "dist/release/$archive" -C dist/stage-linux-x86_64 trk
          checksum="$(sha256sum "dist/release/$archive" | awk '{print $1}')"
          printf '%s  %s\n' "$checksum" "$archive" > "dist/release/$archive.sha256"
          cat > dist/release/trk-linux-x86_64-metadata.json <<EOF
          {
            "version": "$version",
            "architecture": "x86_64",
            "target": "x86_64-unknown-linux-gnu",
            "commit": "$GITHUB_SHA",
            "workflow_run": "$GITHUB_RUN_ID"
          }
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: trk-linux-x86_64
          path: dist/release/*
          if-no-files-found: error

  package-formula:
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: trk-macos-*
          path: dist/release
          merge-multiple: true
      - name: Render checksummed Homebrew formula
        run: |
          version="${GITHUB_REF_NAME#v}"
          arm64_sha256="$(awk '{print $1}' "dist/release/trk-${version}-macos-arm64.tar.gz.sha256")"
          x86_64_sha256="$(awk '{print $1}' "dist/release/trk-${version}-macos-x86_64.tar.gz.sha256")"
          bash scripts/render-homebrew-formula.sh \
            "$version" "$arm64_sha256" "$x86_64_sha256" dist/formula/trk.rb
          ruby -c dist/formula/trk.rb
      - uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: dist/formula/trk.rb
          if-no-files-found: error

  publish-release:
    needs: [package-formula, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: trk-macos-*
          path: dist/release
          merge-multiple: true
      - uses: actions/download-artifact@v5
        with:
          name: trk-linux-x86_64
          path: dist/release
      - uses: actions/download-artifact@v5
        with:
          name: homebrew-formula
          path: dist/release
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            dist/release/*.tar.gz
            dist/release/*.sha256
            dist/release/*-metadata.json
            dist/release/trk.rb

  smoke-homebrew:
    needs: publish-release
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: homebrew-formula
          path: dist/formula
      - name: Install and test the published release through Homebrew
        run: |
          set -euo pipefail
          cleanup() {
            brew uninstall --formula trk >/dev/null 2>&1 || true
            brew untap trk/release-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          brew tap-new trk/release-smoke
          formula_dir="$(brew --repository trk/release-smoke)/Formula"
          cp dist/formula/trk.rb "$formula_dir/trk.rb"
          brew install --formula trk/release-smoke/trk
          trk --version
          trk --help >/dev/null
          brew test trk/release-smoke/trk

  smoke-linux:
    needs: publish-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: trk-linux-x86_64
          path: dist/release
      - name: Run the binary on Ubuntu 24.04
        run: |
          set -euo pipefail
          mkdir -p dist/smoke
          tar -xzf "dist/release/trk-${GITHUB_REF_NAME#v}-linux-x86_64.tar.gz" -C dist/smoke trk
          docker run --rm \
            --volume "$PWD/dist/smoke:/smoke:ro" \
            ubuntu:24.04 \
            sh -c "apt-get update >/dev/null && apt-get install -y libasound2t64 >/dev/null || apt-get install -y libasound2 >/dev/null && /smoke/trk --version && /smoke/trk --help >/dev/null"

  update-homebrew-tap:
    needs: [smoke-homebrew, smoke-linux]
    if: ${{ vars.HOMEBREW_TAP_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: homebrew-formula
          path: dist/formula
      - uses: actions/checkout@v5
        with:
          repository: delaudio/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Publish formula to delaudio/tap
        run: |
          mkdir -p tap/Formula
          cp dist/formula/trk.rb tap/Formula/trk.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/trk.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "trk ${GITHUB_REF_NAME#v}"
          git push
